_schema-version: "3.2"
ID: equipment-monitoring
version: 1.0.0
description: Real-Time Equipment Monitoring & Alerting System (CAP + Event Mesh + Fiori)

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # -------------------------------------------------------------------------
  # CAP backend (Node.js) — OData services + Event Mesh handlers
  # -------------------------------------------------------------------------
  - name: equipment-monitoring-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: equipment-monitoring-auth
      - name: equipment-monitoring-db
      - name: equipment-monitoring-destination
      - name: equipment-monitoring-connectivity
    # Solace broker (external PubSub+ / Advanced Event Mesh) is bound AFTER deploy
    # via a user-provided service — see SOLACE_SETUP.md. The app falls back to
    # internal messaging when no Solace binding is present, so deploy never
    # depends on the broker existing first.

  # -------------------------------------------------------------------------
  # HANA HDI content deployer (tables + sample data)
  # -------------------------------------------------------------------------
  - name: equipment-monitoring-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: equipment-monitoring-db

  # -------------------------------------------------------------------------
  # Standalone application router — serves the Fiori UI and proxies OData
  # -------------------------------------------------------------------------
  - name: equipment-monitoring-approuter
    type: nodejs
    path: app/router
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: custom
      # Copy the Fiori app into the router (served statically) then install deps.
      # `npm install` is used instead of `npm ci` because app/router has no lockfile.
      commands:
        - rm -rf resources/dashboard
        - mkdir -p resources/dashboard
        - cp -r ../dashboard/webapp/. resources/dashboard/
        - npm install --production
      build-result: .
    requires:
      - name: equipment-monitoring-auth
      - name: equipment-monitoring-destination
      - name: equipment-monitoring-connectivity
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  # XSUAA — authentication & authorization (scopes/roles from xs-security.json)
  - name: equipment-monitoring-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: equipment-monitoring-${space}
        tenant-mode: dedicated

  # SAP HANA Cloud (HDI shared container)
  - name: equipment-monitoring-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # NOTE: SAP Event Mesh is not offered in BTP trial. Event-driven messaging is
  # provided by an external Solace PubSub+ broker, bound post-deploy as a
  # user-provided service (equipment-monitoring-solace). See SOLACE_SETUP.md.

  # Destination service — external Maintenance backend integration
  - name: equipment-monitoring-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: MaintenanceBackend
                Description: External maintenance / CMMS backend
                URL: https://maintenance.example.corp
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.DynamicDestination: true

  # Connectivity service — required for on-premise destinations (Cloud Connector)
  - name: equipment-monitoring-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
